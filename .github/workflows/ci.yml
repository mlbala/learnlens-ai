name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

# No cloud credentials required. Offline lint + unit tests + image build only.
# Keep AI_* and YOUTUBE_* on fake providers — never run paid smoke in CI.
env:
  AI_CHAT_PROVIDER: fake
  AI_EMBED_PROVIDER: fake
  YOUTUBE_METADATA_PROVIDER: fake

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.6.14"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync workspace
        run: |
          uv sync --python 3.12
          uv sync --python 3.12 --project apps/api

      - name: Lint
        run: |
          uv run ruff check apps/api tests
          uv run --project apps/api ruff check apps/api

      - name: Typecheck (Python compileall + web tsc)
        run: |
          uv run --project apps/api python -m compileall -q apps/api/app
          npm install --ignore-scripts
          npm run typecheck

      - name: Migration structure check
        run: |
          uv run --project apps/api pytest apps/api/tests/test_migrations.py -m "not integration" -q

      - name: Dependency audit (Python)
        run: |
          # --with installs pip-audit into the API env. A root-level
          # `uv pip install` cannot be spawned by `uv run --project apps/api`.
          # --skip-editable ignores the local package, which is not on PyPI.
          uv run --project apps/api --with pip-audit pip-audit --skip-editable

      - name: Dependency audit (npm)
        run: |
          npm audit --omit=dev --audit-level=high || \
            echo "::warning::npm audit reported high+ findings — review before release"

      - name: Unit + e2e smoke tests (fake providers)
        run: |
          uv run --project apps/api pytest apps/api/tests tests -m "not integration"
          npm run test --workspace=@learnlens/web
          bash scripts/check_layout.sh

  security-guardrails:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.6.14"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync API
        run: |
          uv sync --python 3.12
          uv sync --python 3.12 --project apps/api

      - name: AI + chat guardrails tests (fake providers only)
        env:
          AI_CHAT_PROVIDER: fake
          AI_EMBED_PROVIDER: fake
          YOUTUBE_METADATA_PROVIDER: fake
        run: |
          uv run --project apps/api pytest \
            apps/api/tests/test_ai_guardrails.py \
            apps/api/tests/test_guardrail_framework.py \
            apps/api/tests/test_guardrails_harness.py \
            apps/api/tests/test_security_gate.py \
            apps/api/tests/test_grounded_qa.py \
            apps/api/tests/test_qa_evidence.py \
            apps/api/tests/test_tenant_isolation.py \
            -m "not integration" -q

      - name: Guardrails corpus + regen-loop harness
        env:
          AI_CHAT_PROVIDER: fake
          AI_EMBED_PROVIDER: fake
        run: |
          uv run --project apps/api python -m app.guardrails_harness \
            --out artifacts/guardrails --backend structured

      - name: Web XSS / citation safety tests
        run: |
          npm install --ignore-scripts
          npm run test --workspace=@learnlens/web -- tests/xss-escape.test.tsx tests/citations.test.ts tests/evidence-citation.test.tsx

  eval-suite:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.6.14"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync API
        run: |
          uv sync --python 3.12
          uv sync --python 3.12 --project apps/api

      - name: Offline eval suite (RAG + tutor + guardrails)
        env:
          AI_CHAT_PROVIDER: fake
          AI_EMBED_PROVIDER: fake
        run: |
          uv run --project apps/api python -m app.eval.cli --suite all --out artifacts/eval

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: artifacts/eval
          if-no-files-found: warn

  docker-build:
    runs-on: ubuntu-latest
    # Eval runs in parallel and does not gate image builds (packaging ≠ quality gates).
    needs: [quality, security-guardrails]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (also used as worker)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: learnlens-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: learnlens-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
